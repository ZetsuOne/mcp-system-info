[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-system-info"
version = "0.1.0"
description = "Local MCP server for CPU, RAM, disk, and GPU telemetry (NVIDIA / Intel Arc / AMD / Windows)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ZetsuOne" },
]
keywords = [
    "mcp",
    "system-info",
    "telemetry",
    "gpu",
    "nvidia",
    "intel-arc",
    "amd",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "mcp>=2.3.0",
    "psutil>=5.9.0",
    "nvidia-ml-py>=12.0.0",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/ZetsuOne/mcp-system-info"
Repository = "https://github.com/ZetsuOne/mcp-system-info"
Issues = "https://github.com/ZetsuOne/mcp-system-info/issues"

[project.scripts]
mcp-system-info = "server:main"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]

[tool.hatch.build.targets.sdist]
include = [
    "server.py",
    "client.py",
    "requirements.txt",
    "README.md",
    "README_RU.md",
    "LICENSE",
]
